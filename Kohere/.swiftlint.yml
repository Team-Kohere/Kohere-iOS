analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name
  - todo

opt_in_rules:
  - force_unwrapping
  - empty_count
  - contains_over_filter_is_empty
  - fatal_error_message
  - private_outlet
  - redundant_self
  - shorthand_optional_binding
  - attributes
  - vertical_whitespace
  - sorted_imports
  - mark
  - class_delegate_protocol
  - closure_end_indentation
  - collection_alignment
  - first_where
  - last_where
  - overridden_super_call
  - redundant_nil_coalescing
  - operator_usage_whitespace
  - lower_acl_than_parent

excluded:
  - KohereDesignSystem/Resources/GeneratedAssetSymbols.swift
  - KohereLocalization/Resources/GeneratedStringSymbols.swift
  - Pods
  - Carthage
  - KohereTests
  - KohereUITests

custom_rules:
  asset_string_lookup:
    name: "Asset String Lookup"
    regex: '(?<![A-Za-z])(Image|Color)\("[^"]+"\)|(UIImage|UIColor)\(\s*named:'
    message: "에셋은 생성 심볼(.x)로 접근한다. 이름 문자열은 앱 번들에서 찾으므로 KohereDesignSystem으로 옮긴 뒤에는 빈 이미지·색이 된다."
    severity: warning
  string_catalog_key_literal:
    name: "String Catalog Key Literal"
    regex: 'Text\("[a-z][A-Za-z0-9]*(\.[A-Za-z0-9-]+)+"\)'
    message: "문자열 카탈로그 키는 생성 심볼(.x)로 접근한다. 키 문자열은 앱 번들에서 찾으므로 KohereLocalization으로 옮긴 뒤에는 키가 그대로 보인다."
    severity: warning
  domain_live_value:
    name: "Domain Live Value"
    included: ".*/KohereDomain/Interface/.*\\.swift"
    regex: 'static (let|var) liveValue|: DependencyKey \{'
    message: "Domain의 Client는 TestDependencyKey(testValue)만 채택한다. liveValue는 Data(앱)가 @retroactive DependencyKey로 붙인다. Domain에 두면 Data의 실제 구현이 무시된다."
    severity: error
